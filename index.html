<h1>超级简历PDF导出</h1>
<p>在超级简历中直接下载 PDF 时，部分简历会在分页处出现文字被截断的问题：分页线从一行文字中间穿过，甚至把同一个字的上半部分和下半部分分到两页，影响阅读。</p>
<p>本扩展将已加载的超级简历单栏预览在本机按文字行和段落重新分页，尽量让整行文字完整地留在同一页，再生成可复制文字的 A4 打印版，供浏览器保存为 PDF。</p>
<p>扩展只在用户主动点击后处理当前页面内容，不上传简历正文。</p>
<p><a href="privacy.html">隐私说明</a> · <a href="https://github.com/njwangcn/wondercv-safe-pdf-pages/issues">支持与反馈</a></p>
</main>
